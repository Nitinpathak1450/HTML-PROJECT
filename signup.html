<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="loginstyle.css">
</head>
<body>
    <div class="box1">
        <h1>Create An Account</h1>
        <form>
            <label for="Full Name">Fullname</label><br>
            <input type="text"  placeholder="Enter Full Name" required><br><br>
            <label for="Email">Email</label><br>
            <input type="email" placeholder="Enter Email" required><br><br>
           
            <label for="Phone Number">Phone Number</label><br>
            <input type="tel" placeholder="Enter Phone Number" required><br><br>
             <label for="password">Password</label><br>
            <input type="password" placeholder="Create Password"><br><br>
            <label for="confirm password">Confirm Password</label><br>
            <input type="password" placeholder="Confirm password"><br><br>
            <label for="User Type">User Type</label><br>
            <select name="User Type">
                <option value="Student">Student</option>
                <option value="Admin">Admin</option>
            </select><BR><br>


            <button class="ss" type="submit">Register</button>
            <Br>
          <pre><p>      Already have an account? <a href="login.html">Login</a></p></pre>  
        </form>
    </div>
</body>
</html>
